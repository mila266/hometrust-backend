# ===== Base de datos PostgreSQL LOCAL (sin Docker) =====
# Instala PostgreSQL desde postgresql.org (incluye pgAdmin).
# Crea una base de datos llamada "marketplace" con pgAdmin antes de correr.
spring.datasource.url=jdbc:postgresql://localhost:5432/marketplace
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
# validate: Hibernate solo verifica que el esquema (creado por Flyway) coincida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Flyway (migraciones: crea las tablas del modelo de datos) =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===== Servidor =====
server.port=8080
