# ===== Perfil de PRODUCCION (AWS) =====
# Se activa con la variable de entorno SPRING_PROFILES_ACTIVE=prod
# (el Dockerfile ya la deja puesta). No hay credenciales en el codigo:
# todo viene de variables de entorno que configuras en AWS.

# Base de datos (Amazon RDS PostgreSQL)
# DB_URL ejemplo: jdbc:postgresql://mi-rds.xxxx.us-east-1.rds.amazonaws.com:5432/marketplace
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate: en produccion no mostramos SQL ni dejamos que toque el esquema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway crea/valida las tablas a partir de las migraciones versionadas
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Puerto: muchas plataformas (Elastic Beanstalk) inyectan PORT
server.port=${PORT:8080}

# CORS: URL del frontend desplegado (S3/CloudFront). Admite varias separadas por coma.
app.cors.origenes-permitidos=${CORS_ORIGINS:http://localhost:4200}
